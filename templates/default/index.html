<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falak App</title>
    <style>
      /* The theme is resolved from IndexedDB (async) before the app mounts;
         keep the page hidden until then so the first paint is never the wrong
         theme. main.js removes this class once the theme is applied. */
      html.theme-loading {
        visibility: hidden;
      }
    </style>
    <script>
      // Runs before first paint: hide the page until main.js has hydrated the
      // IndexedDB store and applied the theme (see src/main.js).
      (function () {
        var el = document.documentElement;
        el.classList.add("theme-loading");
        // Safety net: never leave the page hidden if the app fails to boot.
        setTimeout(function () {
          el.classList.remove("theme-loading");
        }, 3000);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
